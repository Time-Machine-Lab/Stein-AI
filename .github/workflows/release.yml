name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release version (for example, v0.1.0)"
        required: true
        type: string
  push:
    tags:
      # GitHub Actions uses glob patterns here, not regex. Match versioned
      # tags broadly at the trigger layer, then enforce strict semver below.
      - "v*.*.*"
      - "!v*-dirty*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release_meta.outputs.tag_name }}
      is_stable: ${{ steps.release_meta.outputs.is_stable }}
      image_namespace: ${{ steps.release_meta.outputs.image_namespace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release version
        id: release_meta
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -Eeuo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REPOSITORY" != "Time-Machine-Lab/Stein-AI" ]]; then
              echo "::error::Manual releases are only supported for Time-Machine-Lab/Stein-AI."
              exit 1
            fi
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "::error::Manual releases must run from the main branch."
              exit 1
            fi
            tag="$REQUESTED_VERSION"
            echo "Manually requested release: $tag"
          else
            tag="$GITHUB_REF_NAME"
            echo "Triggered by tag: $tag"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release versions must look like vX.Y.Z or vX.Y.Z-suffix; got '$tag'."
            exit 1
          fi
          if [[ "$tag" == *-dirty* ]]; then
            echo "::error::Refusing to release from dirty tag '$tag'."
            exit 1
          fi
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          image_namespace=${GITHUB_REPOSITORY_OWNER,,}
          if [[ ! "$image_namespace" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]]; then
            echo "::error::Repository owner cannot be normalized to a valid container namespace."
            exit 1
          fi
          echo "image_namespace=$image_namespace" >> "$GITHUB_OUTPUT"
          if [[ "$tag" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Setup Node.js for native runtime fixtures
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Verify Go test wrapper
        run: bash scripts/test-go.test.sh

      - name: Run tests
        run: bash scripts/test-go.sh --race

      - name: Scan Go vulnerabilities
        # Fail closed unless an administrator scopes the documented emergency
        # override to this exact tag. See .github/RELEASING.md.
        if: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG != steps.release_meta.outputs.tag_name }}
        working-directory: server
        run: go tool govulncheck ./...

      - name: Record emergency vulnerability-scan bypass
        if: ${{ vars.ALLOW_VULN_BYPASS_FOR_TAG == steps.release_meta.outputs.tag_name }}
        env:
          TAG_NAME: ${{ steps.release_meta.outputs.tag_name }}
        run: echo "::warning::govulncheck was explicitly skipped for ${TAG_NAME}; see .github/RELEASING.md"

  release:
    needs: verify
    # Only run on the canonical upstream repo. Forks don't have the
    # HOMEBREW_TAP_GITHUB_TOKEN secret and should not be publishing to
    # `multica-ai/homebrew-tap` anyway. Without this guard, every fork's
    # tag push fails this job (401 against the upstream tap), which makes
    # downstream CI go red without affecting the actual artifact pipeline.
    if: github.repository_owner == 'multica-ai' || github.repository == 'Time-Machine-Lab/Stein-AI'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          # The Homebrew tap only exists upstream; the fork publishes CLI archives
          # to its own GitHub Release and `multica update` reads them from there.
          args: release --clean${{ github.repository_owner != 'multica-ai' && ' --skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Multi-arch images are built natively per platform on dedicated runners
  # (amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm) and merged into a
  # manifest list. This avoids QEMU emulation, which was making the Next.js
  # arm64 build run for 30+ minutes per release.
  docker-backend-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      REGISTRY: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && 'docker.io' || 'ghcr.io' }}
      BACKEND_IMAGE: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && format('docker.io/{0}/multica-backend', secrets.DOCKER_USERNAME) || format('ghcr.io/{0}/multica-backend', needs.verify.outputs.image_namespace) }}
    steps:
      - name: Validate Docker Hub credentials
        if: github.repository == 'Time-Machine-Lab/Stein-AI'
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]] || {
            echo "::error::DOCKER_USERNAME and DOCKER_PASSWORD are required for Stein-AI releases."
            exit 1
          }
          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
            echo "::error::DOCKER_USERNAME is not a valid Docker Hub namespace."
            exit 1
          }

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute backend image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          labels: |
            org.opencontainers.image.title=Multica Backend
            org.opencontainers.image.description=Multica self-hosted backend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-backend-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-backend-${{ env.PLATFORM_PAIR }}
          build-args: |
            VERSION=${{ needs.verify.outputs.tag_name }}
            COMMIT=${{ github.sha }}
          outputs: type=image,name=${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-backend-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-backend-merge:
    needs: [verify, docker-backend-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-backend-${{ github.ref }}
      cancel-in-progress: true
    env:
      REGISTRY: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && 'docker.io' || 'ghcr.io' }}
      BACKEND_IMAGE: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && format('docker.io/{0}/multica-backend', secrets.DOCKER_USERNAME) || format('ghcr.io/{0}/multica-backend', needs.verify.outputs.image_namespace) }}
    steps:
      - name: Validate Docker Hub credentials
        if: github.repository == 'Time-Machine-Lab/Stein-AI'
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]] || {
            echo "::error::DOCKER_USERNAME and DOCKER_PASSWORD are required for Stein-AI releases."
            exit 1
          }
          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
            echo "::error::DOCKER_USERNAME is not a valid Docker Hub namespace."
            exit 1
          }

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-backend-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute backend image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -Eeuo pipefail
          tag_args=()
          while IFS= read -r image_tag; do
            tag_args+=(-t "$image_tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          image_sources=()
          for digest in *; do
            image_sources+=("$BACKEND_IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${image_sources[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "$BACKEND_IMAGE:${{ steps.meta.outputs.version }}"

  docker-web-build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    env:
      REGISTRY: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && 'docker.io' || 'ghcr.io' }}
      WEB_IMAGE: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && format('docker.io/{0}/multica-web', secrets.DOCKER_USERNAME) || format('ghcr.io/{0}/multica-web', needs.verify.outputs.image_namespace) }}
    steps:
      - name: Validate Docker Hub credentials
        if: github.repository == 'Time-Machine-Lab/Stein-AI'
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]] || {
            echo "::error::DOCKER_USERNAME and DOCKER_PASSWORD are required for Stein-AI releases."
            exit 1
          }
          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
            echo "::error::DOCKER_USERNAME is not a valid Docker Hub namespace."
            exit 1
          }

      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute web image labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          labels: |
            org.opencontainers.image.title=Multica Web
            org.opencontainers.image.description=Multica self-hosted web frontend

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          pull: true
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-web-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-web-${{ env.PLATFORM_PAIR }}
          build-args: |
            REMOTE_API_URL=http://backend:8080
            NEXT_PUBLIC_APP_VERSION=${{ needs.verify.outputs.tag_name }}
          outputs: type=image,name=${{ env.WEB_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-web-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-web-merge:
    needs: [verify, docker-web-build]
    runs-on: ubuntu-latest
    concurrency:
      group: release-docker-web-${{ github.ref }}
      cancel-in-progress: true
    env:
      REGISTRY: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && 'docker.io' || 'ghcr.io' }}
      WEB_IMAGE: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && format('docker.io/{0}/multica-web', secrets.DOCKER_USERNAME) || format('ghcr.io/{0}/multica-web', needs.verify.outputs.image_namespace) }}
    steps:
      - name: Validate Docker Hub credentials
        if: github.repository == 'Time-Machine-Lab/Stein-AI'
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -Eeuo pipefail
          [[ -n "$DOCKER_USERNAME" && -n "$DOCKER_PASSWORD" ]] || {
            echo "::error::DOCKER_USERNAME and DOCKER_PASSWORD are required for Stein-AI releases."
            exit 1
          }
          [[ "$DOCKER_USERNAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
            echo "::error::DOCKER_USERNAME is not a valid Docker Hub namespace."
            exit 1
          }

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-web-*
          merge-multiple: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute web image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WEB_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ needs.verify.outputs.is_stable == 'true' }}
            type=raw,value=${{ needs.verify.outputs.tag_name }}
            type=sha,prefix=sha-

      - name: Login to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && secrets.DOCKER_USERNAME || github.actor }}
          password: ${{ github.repository == 'Time-Machine-Lab/Stein-AI' && secrets.DOCKER_PASSWORD || secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          set -Eeuo pipefail
          tag_args=()
          while IFS= read -r image_tag; do
            tag_args+=(-t "$image_tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          image_sources=()
          for digest in *; do
            image_sources+=("$WEB_IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${image_sources[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect \
            "$WEB_IMAGE:${{ steps.meta.outputs.version }}"

  deploy-production:
    needs: [verify, docker-backend-merge, docker-web-merge]
    if: github.repository == 'Time-Machine-Lab/Stein-AI'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: stein-ai-production
      cancel-in-progress: false
    env:
      # Production runs on the K3s cluster (k3s.tmlab.top), namespace stein-ai,
      # Helm release "multica". KUBE_CONFIG is a kubeconfig for the namespace-scoped
      # ServiceAccount stein-ai/ci-deployer; it cannot touch other namespaces.
      NAMESPACE: stein-ai
      RELEASE: multica
      PUBLIC_URL: https://steinai.tmlab.top
      BACKEND_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/multica-backend
      WEB_IMAGE: docker.io/${{ secrets.DOCKER_USERNAME }}/multica-web
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release commit is on main
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin main
          release_commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "::error::Release source ${GITHUB_REF_NAME} does not point to a commit on main."
            exit 1
          fi

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Configure cluster access
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          set -Eeuo pipefail
          [[ -n "$KUBE_CONFIG" ]] || { echo "::error::Repository secret KUBE_CONFIG is required."; exit 1; }
          install -m 0700 -d "$HOME/.kube"
          printf '%s\n' "$KUBE_CONFIG" > "$HOME/.kube/config"
          chmod 0600 "$HOME/.kube/config"
          kubectl -n "$NAMESPACE" get deployment "$RELEASE-backend" "$RELEASE-frontend"

      - name: Deploy release to K3s
        shell: bash
        env:
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          set -Eeuo pipefail
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          echo "Deploying $TAG_NAME (previous: $(helm -n "$NAMESPACE" get values "$RELEASE" -a -o json | jq -r '.images.backend.tag'))"
          # The backend runs `migrate up` on start; the chart uses strategy Recreate.
          # On failure: helm -n stein-ai rollback multica
          if ! helm upgrade "$RELEASE" deploy/helm/multica \
              --namespace "$NAMESPACE" \
              -f deploy/k3s/values.yaml \
              --set images.backend.repository="$BACKEND_IMAGE" \
              --set images.backend.tag="$TAG_NAME" \
              --set images.frontend.repository="$WEB_IMAGE" \
              --set images.frontend.tag="$TAG_NAME" \
              --wait --timeout 10m; then
            kubectl -n "$NAMESPACE" get pods -o wide || true
            kubectl -n "$NAMESPACE" logs "deployment/$RELEASE-backend" --tail=80 || true
            echo "::error::Deployment of $TAG_NAME failed. Roll back with: helm -n $NAMESPACE rollback $RELEASE"
            exit 1
          fi
          kubectl -n "$NAMESPACE" apply -f deploy/k3s/ingress.yaml
          helm -n "$NAMESPACE" history "$RELEASE" --max 3

      - name: Check public endpoint
        shell: bash
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsS -o /dev/null "$PUBLIC_URL/api/config" && curl -fsS -o /dev/null "$PUBLIC_URL/"; then
              echo "$PUBLIC_URL is healthy"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PUBLIC_URL did not become healthy after the deployment."
          exit 1

  helm-chart:
    needs: [verify, docker-backend-merge, docker-web-merge]
    if: github.repository_owner == 'multica-ai'
    runs-on: ubuntu-latest
    concurrency:
      group: release-helm-chart-${{ github.ref }}
      cancel-in-progress: true
    env:
      CHART_DIR: deploy/helm/multica
      OCI_REGISTRY: oci://ghcr.io/${{ needs.verify.outputs.image_namespace }}/charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Sync chart metadata with release tag
        env:
          TAG_NAME: ${{ needs.verify.outputs.tag_name }}
        run: |
          chart_version="${TAG_NAME#v}"
          sed -i -E "s/^version:.*/version: ${chart_version}/" "$CHART_DIR/Chart.yaml"
          sed -i -E "s/^appVersion:.*/appVersion: \"${TAG_NAME}\"/" "$CHART_DIR/Chart.yaml"
          echo "CHART_VERSION=${chart_version}" >> "$GITHUB_ENV"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination .chart-packages

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push chart to GHCR
        run: helm push ".chart-packages/multica-${CHART_VERSION}.tgz" "$OCI_REGISTRY"

      - name: Verify published chart
        run: helm show chart "$OCI_REGISTRY/multica" --version "$CHART_VERSION"

  # Build the Desktop installers for Linux and Windows and upload them to
  # the GitHub Release that the `release` job above just published. macOS
  # Desktop continues to ship via the manual `release-desktop` skill so it
  # can be signed + notarized with Apple Developer credentials that are
  # not (yet) wired into CI.
  desktop:
    needs: release
    if: github.repository_owner == 'multica-ai'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install rpmbuild (Linux)
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Deliberately independent from the minimum patch in server/go.mod:
          # releases follow the newest 1.26 patch available to setup-go.
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: server/go.sum

      - name: Record Go toolchain
        run: go version

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package Desktop installers (${{ matrix.target }})
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # electron-builder's GitHub publisher reads this:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable code signing on Linux/Windows for now — the public
          # release is unsigned for these platforms, the CLI carries the
          # trust boundary. Set CSC_LINK in repo secrets to enable
          # Windows signing later.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/package.mjs --${{ matrix.target }} --x64 --arm64 --publish always
